# Mac-Like Configuration Example
#
# Uses "Alt" button to the left of spacebar as "Cmd" key
#
[ids]
*

[main]
# Create a new "Cmd" button, with various Mac OS-like features below
leftalt = layer(meta_mac)
rightalt = layer(vim_direction)
leftcontrol = layer(cmd_edit)
leftmeta = layer(option_mac)

# meta_mac layer: our "Cmd" key.
#
# Deliberately NOT [meta_mac:C]: a :C layer presses Ctrl the moment Cmd goes down, so
# Cmd+Tab becomes Ctrl↓ ... Alt↓ Ctrl↑ Tab↓. With fcitx5 as KWin's virtual keyboard,
# fcitx5 echoes modifier state back asynchronously and KWin applies it globally
# (InputMethod::modifiers -> xkb_state_update_mask); a stale "Ctrl+Alt" echo makes every
# following Tab look like Ctrl+Alt+Tab and the task switcher ignores it until Alt is
# released. So Cmd sends nothing by itself and each Cmd+key is mapped to Ctrl+key below.
# Downside: Cmd+click / Cmd+scroll no longer act as Ctrl+click / Ctrl+scroll.
[meta_mac]
# Cmd+key -> Ctrl+key (what [meta_mac:C] used to do implicitly)
a = C-a
b = C-b
d = C-d
e = C-e
f = C-f
g = C-g
h = C-h
i = C-i
j = C-j
k = C-k
l = C-l
m = C-m
n = C-n
o = C-o
p = C-p
r = C-r
s = C-s
t = C-t
u = C-u
w = C-w
y = C-y
z = C-z
0 = C-0
minus = C-minus
equal = C-equal
leftbrace = C-leftbrace
rightbrace = C-rightbrace
backslash = C-backslash
semicolon = C-semicolon
apostrophe = C-apostrophe
comma = C-comma
dot = C-dot
slash = C-slash
enter = C-enter
backspace = C-backspace
delete = C-delete
up = C-up
down = C-down
esc = C-esc
home = C-home
end = C-end
pageup = C-pageup
pagedown = C-pagedown
insert = C-insert
f1 = C-f1
f2 = C-f2
f3 = C-f3
f4 = C-f4
f5 = C-f5
f6 = C-f6
f7 = C-f7
f8 = C-f8
f9 = C-f9
f10 = C-f10
f11 = C-f11
f12 = C-f12

shift = layer(meta_mac_shift)
# Move cursor to beginning of line
left = home
# Move cursor to end of Line
right = end

# Meta-Space: Open the Launcher (a feature of gnome-shell)
# keybinding: "Naviage applications and windows -> Launch and switch applications"
space = M-s
c = C-insert
v = S-insert
x = S-delete
q = A-f4

1 = A-1
2 = A-2
3 = A-3
4 = A-4
5 = A-5
6 = A-6
7 = A-7
8 = A-8
9 = A-9


# As soon as tab is pressed (but not yet released), we switch to the
# "app_switch_state" overlay where we can handle Meta-Backtick differently.
# Also, send a 'M-tab' key tap before entering app_switch_sate.
tab = swapm(app_switch_state, A-tab)

# Meta-Backtick: Switch to next window in the application group
# KDE: Meta+Tab only accepts one Tab per Meta press (bugs.kde.org 419176), so use Alt
# - keybinding: `gsettings get org.gnome.desktop.wm.keybindings switch-group`
` = swapm(app_switch_in_its_own_group, A-`)


[meta_mac_shift:C-S]
# Highlight to beginning of line
left = S-home
# Highlight to end of Line
right = S-end

# app_switch_state modifier layer; inherits from 'Meta' modifier layer
[app_switch_state:A]

# Meta-Tab: Switch to next application
# - keybinding: `gsettings get org.gnome.desktop.wm.keybindings switch-applications`
tab = A-tab
right = A-tab

# Meta-Backtick: Switch to previous application
# - keybinding: `gsettings get org.gnome.desktop.wm.keybindings switch-applications-backward`
left = A-S-tab

[app_switch_in_its_own_group:A]
` = A-`

[vim_direction]
h = left
j = down
k = up
l = right

[cmd_edit:C]
a = home
e = end

[option_mac:M]
backspace = C-backspace
left = C-left
right = C-right

[cmd_edit+meta_mac]
q = M-escape
f = rightmouse
